name: Publish registry site

# Builds registry.json and every page from the extensions repository, then
# deploys the result to GitHub Pages at extensions.runtimeconditions.io.

on:
  push:
    branches:
      - main
  # The extensions repository sends this when its catalog changes.
  repository_dispatch:
    types:
      - extensions-updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out extensions repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runtimeconditions/extensions
          path: extensions-src
          persist-credentials: false
          # Full history and tags show which packages older extension versions had.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build the site
        run: |
          python scripts/build_registry.py --extensions extensions-src --output _site/registry.json --check-registries
          python scripts/build_site.py --registry _site/registry.json --extensions extensions-src --output _site

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
