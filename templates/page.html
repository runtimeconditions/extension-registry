<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="icon" type="image/svg+xml" href="/assets/runtime-conditions-icon.svg" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/theme.js"></script>
    <script src="/assets/registry.js" defer></script>
  </head>
  <body>
    <div class="notice">
      This is an early preview of the extension registry.
    </div>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">
          <img src="/assets/runtime-conditions-logo.svg" width="141" height="48" alt="Runtime Conditions" />
        </a>
        <nav class="main-nav" aria-label="Main">
          <a href="/"{{current_home}}>Home</a>
          <a href="/extensions/"{{current_extensions}}>Extensions</a>
          <a href="https://runtimeconditions.io/extensions.html">Docs</a>
        </nav>
        <nav class="icon-nav" aria-label="Community">
          <a href="https://github.com/runtimeconditions" aria-label="GitHub" title="GitHub">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.3-.5-1.5.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>
          </a>
          <a href="https://cloud-native.slack.com/archives/C0C0R4M65FZ" aria-label="Slack" title="CNCF Slack">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>
          </a>
        </nav>
      </div>
    </header>

    <div class="frame">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/" aria-label="Home">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
        </a>
        {{breadcrumb}}
      </nav>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-inner">
            <label class="search">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
              <input id="search" type="search" placeholder="Search extensions" aria-label="Search extensions" aria-controls="main" autocomplete="off" spellcheck="false" />
              <kbd aria-hidden="true">/</kbd>
            </label>
            <nav class="side-nav" aria-label="Extensions">
              <a href="/extensions/"{{current_available}}>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Available extensions
              </a>
            </nav>
            {{sidebar}}
          </div>
        </aside>

        <main class="content {{main_class}}" id="main" aria-live="polite">
{{main}}
        </main>
      </div>
    </div>
  </body>
</html>
